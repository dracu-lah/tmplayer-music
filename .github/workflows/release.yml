name: Release

# Releases are cut deliberately, by pushing a tag, and only when the owner says so (AGENTS.md,
# release cadence guard: run `gh release list --limit 10` first):
#
#     git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1
#
# Nothing else builds a signed APK. That matters because this is the only job that can see the
# signing key, and keeping it off the push to main path means an ordinary commit, or a pull request
# from a stranger, can never reach it. Adapted from TMPlayer's release workflow.
#
# One tag makes one GitHub release with one file in it: the signed APK. GitHub attaches the source
# archives by itself and shows each file's SHA-256 beside it.
#
# A test version, tagged vX.Y.Z-beta.N before the release vX.Y.Z, goes through the same steps but is
# published as a GitHub pre-release that is never marked latest. Every release is a tested
# pre-release first.
#
# This is the GitHub APK. The app has no updater today, and the build is checked below to hold no
# REQUEST_INSTALL_PACKAGES. If an updater is ever added, it belongs in this APK only: a store build
# has no updater and no REQUEST_INSTALL_PACKAGES (AGENTS.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Derive version from the tag
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      # "true" for a test version (vX.Y.Z-beta.N), "false" for a release.
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # Android will not install an APK whose versionCode is lower than the installed one, so it is
      # derived from the tag: major*1000000 + minor*10000 + patch*100 + stage, where test version N
      # is stage N (1 to 98) and the release 99, so a test version sits between the release before
      # it and its own release. Any other tag shape is refused.
      - name: Derive version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-beta\.([0-9]+))?$ ]]; then
            echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-beta.N"
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]})); minor=$((10#${BASH_REMATCH[2]})); patch=$((10#${BASH_REMATCH[3]}))
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::minor and patch must be 99 or less to fit the versionCode"
            exit 1
          fi
          if [ -n "${BASH_REMATCH[4]}" ]; then
            stage=$((10#${BASH_REMATCH[5]}))
            if [ "$stage" -lt 1 ] || [ "$stage" -gt 98 ]; then
              echo "::error::a test version is -beta.1 to -beta.98"
              exit 1
            fi
            prerelease=true
          else
            stage=99
            prerelease=false
          fi
          code=$((major * 1000000 + minor * 10000 + patch * 100 + stage))
          {
            echo "name=${TAG#v}"
            echo "code=$code"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::$TAG: version ${TAG#v}, code $code, pre-release $prerelease"

  android:
    name: Android (signed APK)
    needs: version
    runs-on: ubuntu-latest
    # Attach required reviewers to this environment in the repository settings to gate the key.
    environment: release

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See CONTRIBUTING.md for the setup commands"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Write Telegram credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::TG_API_ID or TG_API_HASH is not set, so the released APK could not sign in"
            exit 1
          fi
          cat > local.properties <<EOF
          TG_API_ID=$TG_API_ID
          TG_API_HASH=$TG_API_HASH
          EOF

      - name: Run unit tests
        run: ./gradlew :core:jvmTest :app:testDebugUnitTest --console=plain

      - name: Build the signed APK
        run: |
          ./gradlew :app:assembleRelease --console=plain \
            -PtmVersionName=${{ needs.version.outputs.name }} \
            -PtmVersionCode=${{ needs.version.outputs.code }}

      - name: Check the APK
        run: |
          VERSION="${{ needs.version.outputs.name }}"
          SRC="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$SRC" ]; then
            echo "::error::No release APK was built"
            exit 1
          fi
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          # Signed with the release key: an unsigned APK would mean keystore.properties was not read.
          "$BT/apksigner" verify --print-certs "$SRC" | grep -E '^Signer #1 certificate (DN|SHA-256)'
          # The GitHub APK stays without the install permission until an updater exists, and a store
          # build must never have it (AGENTS.md).
          if "$BT/aapt2" dump permissions "$SRC" | grep -q 'REQUEST_INSTALL_PACKAGES'; then
            echo "::error::The APK asks for REQUEST_INSTALL_PACKAGES"
            exit 1
          fi
          # The version the tag asked for, so an install over an older copy is accepted.
          BADGE="$("$BT/aapt2" dump badging "$SRC" | head -n 1)"
          echo "$BADGE"
          if ! echo "$BADGE" | grep -q "versionCode='${{ needs.version.outputs.code }}' versionName='$VERSION'"; then
            echo "::error::The APK's version is not the tag's (code ${{ needs.version.outputs.code }}, name $VERSION). app/build.gradle.kts must read tmVersionCode and tmVersionName"
            exit 1
          fi
          mkdir -p dist mapping
          cp "$SRC" "dist/TMPlayerMusic-$VERSION.apk"
          # R8 renames every class, so a stack trace from a released APK is unreadable without the
          # mapping for that exact build. It is kept as a workflow artifact, not published.
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "mapping/mapping-$VERSION.txt"
          fi
          ls -la dist mapping

      # Anything holding the signing key or the credentials is deleted before any step that
      # uploads output. The runner is thrown away anyway; this is belt and braces against a future
      # step archiving the workspace.
      - name: Shred signing material
        if: always()
        run: rm -f release.keystore keystore.properties local.properties

      - name: Hand the APK to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*
          retention-days: 3
          if-no-files-found: error

      - name: Keep the R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ needs.version.outputs.name }}
          path: mapping/*
          retention-days: 90
          if-no-files-found: warn

  publish:
    name: Publish the release
    needs: [version, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Gather the APK
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist

      - name: Check that nothing is missing
        run: |
          f="dist/TMPlayerMusic-${{ needs.version.outputs.name }}.apk"
          if [ ! -f "$f" ]; then
            echo "::error::$f is missing"
            exit 1
          fi

      - name: Write the release notes
        run: |
          {
            if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
              echo "**Test version.** It works, but expect rough edges. Please report what you find in Issues, with Send logs from Settings."
              echo
            fi
            echo "TMPlayer Music is a player for the audio files already in your own Telegram chats. Unofficial, not affiliated with Telegram."
            echo
            echo "Install: download \`TMPlayerMusic-${{ needs.version.outputs.name }}.apk\` on an Android 6.0 or newer phone, open it and allow the install. See INSTALL.md."
            echo
            echo "Licence: GPL-3.0-or-later with an OpenSSL exception. Libraries and their sources: THIRD_PARTY_NOTICES.md. Lawful use: https://tmplayer.org/legal"
          } > notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: TMPlayer Music ${{ needs.version.outputs.name }}
          body_path: notes.md
          files: dist/*
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
