# Pinned to the same versions as TMPlayer (../TMPlayer/gradle/libs.versions.toml), which has the
# notes on why each one is where it is. Move them together.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
# The BOM maps material3 to 1.4.0, whose Expressive components (wavy progress, button groups,
# toggle buttons, MaterialExpressiveTheme) are internal. 1.5.0 makes them public but raises
# minSdk to 24 (material3-ripple), below our Android 6 floor, so it is not used: the app draws its
# own versions (app/.../ui/theme and ui/player).
lifecycle = "2.11.0"
coroutines = "1.11.0"
tdl = "17.0.0"
zxing = "3.5.4"
jmdns = "3.5.9"
desugarJdkLibs = "2.1.5"
kotlinxSerialization = "1.11.0"
junit = "4.13.2"
# nextlib is published as <media3 version>-<nextlib version>: the two move together (TMPlayer notes).
media3 = "1.11.1"
nextlib = "1.11.1-0.16.0"
sqlite = "2.7.1"
# The desktop app (:desktop), pinned to what ../TMPlayer's desktop uses: Compose Multiplatform with
# its own Material 3, libmpv through mediamp, per user folders and JNA for the OS bits.
composeMultiplatform = "1.12.2"
cmpMaterial3 = "1.12.0-alpha03"
mediamp = "0.5.2"
appdirs = "1.4.0"
slf4j = "2.0.20"
# OS integration (tray is AWT; MPRIS on Linux over D-Bus; native file dialogs), as ../TMPlayer: dbus-java for
# MPRIS, JNA pinned to what Compose and mediamp already resolve to, FileKit for the portal file chooser.
dbusJava = "5.2.2"
jna = "5.19.1"
filekit = "0.16.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs_nio", version.ref = "desugarJdkLibs" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
tdl-coroutines = { group = "dev.g000sha256", name = "tdl-coroutines", version.ref = "tdl" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
# Casting (regular APK only, see app/build.gradle.kts storeBuild): Media3's CastPlayer, which brings Google's
# Cast framework and MediaRouter with it. Same version as the other Media3 modules.
androidx-media3-cast = { group = "androidx.media3", name = "media3-cast", version.ref = "media3" }
nextlib-media3ext = { group = "io.github.anilbeesetti", name = "nextlib-media3ext", version.ref = "nextlib" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
cmp-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "cmpMaterial3" }
cmp-ui-test-junit4 = { group = "org.jetbrains.compose.ui", name = "ui-test-junit4", version.ref = "composeMultiplatform" }
mediamp-api = { group = "org.openani.mediamp", name = "mediamp-api", version.ref = "mediamp" }
mediamp-mpv = { group = "org.openani.mediamp", name = "mediamp-mpv", version.ref = "mediamp" }
mediamp-runtime-linux-x64 = { group = "org.openani.mediamp", name = "mediamp-mpv-runtime-linux-x64", version.ref = "mediamp" }
mediamp-runtime-windows-x64 = { group = "org.openani.mediamp", name = "mediamp-mpv-runtime-windows-x64", version.ref = "mediamp" }
mediamp-runtime-macos-arm64 = { group = "org.openani.mediamp", name = "mediamp-mpv-runtime-macos-arm64", version.ref = "mediamp" }
appdirs = { group = "net.harawata", name = "appdirs", version.ref = "appdirs" }
dbus-java-core = { group = "com.github.hypfvieh", name = "dbus-java-core", version.ref = "dbusJava" }
dbus-java-transport-native-unixsocket = { group = "com.github.hypfvieh", name = "dbus-java-transport-native-unixsocket", version.ref = "dbusJava" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }
filekit-dialogs-compose = { group = "io.github.vinceglb", name = "filekit-dialogs-compose", version.ref = "filekit" }
slf4j-nop = { group = "org.slf4j", name = "slf4j-nop", version.ref = "slf4j" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
jmdns = { group = "org.jmdns", name = "jmdns", version.ref = "jmdns" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
